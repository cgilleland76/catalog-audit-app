# Two Netlify sites build this repo, each with its own Netlify Database:
#   sku-doctor      ← main  (public app)
#   sku-doctor-dev  ← dev   (dev app)
[build]
  # The database is only available to the running app, which creates its own
  # tables on first start (app/lib/migrations.server.ts).
  command = "node scripts/check-env.mjs && npx prisma generate && npm run build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # Prisma loads its query engine and schema from disk at runtime.
  included_files = [
    "node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node",
    "node_modules/.prisma/client/schema.prisma",
  ]
