# Netlify builds SKU Doctor from GitHub: `main` is the public app, the `dev`
# branch deploys the dev app to dev--<site>.netlify.app.
[build]
  # Applies database migrations to this environment's schema, then builds.
  command = "npx prisma generate && node scripts/migrate.mjs && npm run build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "22"

# The dev app keeps its data in its own schema of the same database.
[context.dev.environment]
  DB_SCHEMA = "dev"

[functions]
  # Prisma loads its query engine and schema from disk at runtime.
  included_files = [
    "node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node",
    "node_modules/.prisma/client/schema.prisma",
  ]
