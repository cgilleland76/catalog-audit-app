# SKU Doctor Dev: the test app, installed on the dev store and served by the
# sku-doctor-dev Netlify site (builds the `dev` branch). Push changes with:
# npm run deploy -- --config dev

# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "8b3c6f9b87ff02a22cdb1fadbd748be0"
name = "SKU Doctor Dev"
handle = "sku-doctor-dev"
application_url = "https://sku-doctor-dev.netlify.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_inventory"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://sku-doctor-dev.netlify.app/auth/callback" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
